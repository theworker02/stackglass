name: Feature Request
description: Propose a Stackglass capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Prefer extending an existing MCP tool, the CLI, or the dashboard over adding a 23rd MCP tool.
    validations:
      required: true
