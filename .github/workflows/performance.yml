name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node benchmarks/index.mjs
